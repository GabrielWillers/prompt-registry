# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: networkpolicy-sentinel — endurece uma NetworkPolicy permissiva em default-deny

prompts:
  - file://prompt.md

# Provider de REFERÊNCIA — é contra este modelo que o gate decide.
# Testar todo modelo no caminho crítico transforma o gate numa matriz de
# compatibilidade, que é outra pergunta: "o prompt regrediu?" e "este modelo
# aguenta o prompt?" têm consequências diferentes. O segundo modelo roda no job
# informativo `matriz-de-modelos` do workflow, sem poder derrubar o build.
providers:
  - id: google:gemini-3.1-flash-lite
    config:
      temperature: 0 # gate reprodutível: sem isto a nota oscila entre rodadas
      inputCost: 0.0000001 # US$ 0,10 / 1M tokens
      outputCost: 0.0000004 # US$ 0,40 / 1M tokens

defaultTest:
  assert:
    # Latência e custo NÃO são o gate de regressão — são telemetria com um teto
    # grosseiro. O CP08 mediu que 5s reprova por tamanho de saída; em CI, com
    # rede e fila de provedor no meio, derrubava metade da suíte. Um prompt não
    # regride porque a chamada levou 7s em vez de 4s. O teto de 60s continua
    # pegando o que importa: alguém fazer o prompt gerar dez vezes mais texto.
    - type: latency
      threshold: 60000 # ms
    - type: cost
      threshold: 0.05 # USD

tests:
  - description: Manifesto allow-all do Sentinel + padrão da Aegis + mapa de serviços
    vars:
      manifesto: |
        # manifesto barrado pela revisão de segurança — permissivo demais
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: sentinel-allow
          namespace: sentinel-prod
        spec:
          podSelector: {}          # aplica a todos os pods do namespace
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - {}                   # libera QUALQUER origem
          egress:
            - {}                   # libera QUALQUER destino
      padrao: |
        NetworkPolicy para o namespace "sentinel-prod":
        - pods do Sentinel só aceitam tráfego de entrada do Relay (consumo de
          eventos) e do gateway de API da plataforma
        - pods do Sentinel só fazem saída para: Forge (warehouse, porta 5432),
          Cerebro (busca, porta 9200) e DNS interno
        - nada de "allow all" em ingress ou egress
        - política default-deny explícita no namespace
        - toda regra precisa de comentário dizendo qual fluxo legítimo ela libera
      mapa_servicos: |
        Sentinel     → namespace sentinel-prod, pods com label app=sentinel
        Relay        → namespace relay-prod,    pods com label app=relay
        API gateway  → namespace edge,          pods com label app=api-gateway
        Forge        → namespace forge-prod,    pods com label app=forge,   porta 5432 (Postgres do warehouse)
        Cerebro      → namespace cerebro-prod,  pods com label app=cerebro, porta 9200 (Elasticsearch)
        DNS interno  → namespace kube-system,   pods com label k8s-app=kube-dns, porta 53
    assert:
      # --- é uma NetworkPolicy com os dois policyTypes ---
      - type: contains
        value: 'kind: NetworkPolicy'
      - type: javascript
        value: |
          const t = String(output);
          const bloco = t.match(/policyTypes:[\s\S]{0,120}/g) || [];
          const temAmbos = bloco.some((b) => /Ingress/.test(b) && /Egress/.test(b));
          if (!temAmbos) {
            return { pass: false, score: 0, reason: 'policyTypes não contém Ingress e Egress juntos' };
          }
          return true;

      # --- nenhuma regra allow-all DENTRO da política gerada ---
      # Escopo importa: a seção AUTOVERIFICAÇÃO cita a própria pergunta
      # "sobrou algum `- {}`?", então um not-contains sobre a saída inteira
      # reprova uma política correta. O teste olha só a região do manifesto.
      - type: javascript
        value: |
          const t = String(output);
          const corte = t.search(/^#*\s*(###\s*)?\d*\.?\s*(PEND[ÊE]NCIAS|AUTOVERIFICA)/im);
          const yaml = corte > 0 ? t.slice(0, corte) : t;
          if (/-\s*\{\}/.test(yaml)) {
            return { pass: false, score: 0, reason: 'regra allow-all "- {}" na política gerada' };
          }
          return true;

      # --- egress libera Forge (5432) e Cerebro (9200) ---
      - type: regex
        value: 'port:\s*5432'
      - type: regex
        value: 'port:\s*9200'
      - type: contains
        value: 'app: forge'
      - type: contains
        value: 'app: cerebro'

      # --- ingress libera o Relay ---
      - type: contains
        value: 'app: relay'

      # --- toda regra de ingress/egress tem comentário explicando o fluxo ---
      # O comentário é aceito em qualquer posição do bloco da regra: na mesma
      # linha, na linha acima ou dentro do bloco (inclusive depois dele). Os
      # três são YAML idiomático e os três atendem ao padrão — um assert que
      # exija uma posição específica reprova política correta por estilo.
      - type: javascript
        value: |
          const linhas = String(output).split('\n');
          const inicios = [];
          linhas.forEach((l, i) => {
            if (/^\s*-\s*(from|to):/.test(l)) inicios.push(i);
          });
          if (inicios.length === 0) {
            return { pass: false, score: 0, reason: 'nenhuma regra ingress/egress encontrada' };
          }
          const semComentario = [];
          inicios.forEach((ini, k) => {
            const fim = k + 1 < inicios.length ? inicios[k + 1] : linhas.length;
            const bloco = linhas.slice(ini, fim);
            const acima = ini > 0 && linhas[ini - 1].trim().startsWith('#');
            if (!acima && !bloco.some((l) => l.includes('#'))) {
              semComentario.push(`L${ini + 1}: ${linhas[ini].trim()}`);
            }
          });
          if (semComentario.length > 0) {
            return {
              pass: false,
              score: 0,
              reason: `${semComentario.length} regra(s) sem comentário -> ${semComentario.join(' | ')}`,
            };
          }
          return true;

      # --- não inventar identidade: o namespace é selecionado pela label certa ---
      # Regra 2 do prompt: usar SOMENTE o que está no mapa de serviços. O mapa dá
      # o NOME do namespace, e a label que o Kubernetes popula sozinho para isso
      # é kubernetes.io/metadata.name. Escrever `name: relay-prod` inventa uma
      # label que pode não existir no cluster — a política aplica e não casa nada.
      - type: javascript
        value: |
          const t = String(output);
          const corte = t.search(/^#*\s*(###\s*)?\d*\.?\s*(PEND[ÊE]NCIAS|AUTOVERIFICA)/im);
          const yaml = corte > 0 ? t.slice(0, corte) : t;
          const ns = [...yaml.matchAll(/namespaceSelector:\s*\{?\s*matchLabels:\s*\{?\s*([\w./-]+)\s*:/g)];
          const ruins = ns.map((m) => m[1]).filter((k) => k !== 'kubernetes.io/metadata.name');
          if (ruins.length > 0) {
            return {
              pass: false,
              score: 0,
              reason: `namespaceSelector com label inventada: ${[...new Set(ruins)].join(', ')}`,
            };
          }
          return true;
